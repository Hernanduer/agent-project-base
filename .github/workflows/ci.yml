name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Install the application's pinned toolchain and dependencies here.
      # Once application checks are configured, add --require-project.
      - run: bash tools/ci.sh quick
